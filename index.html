<style>
:root{
  --bg:#0b0e14; --bg-elev:#12151d; --card:#1a1f2b; --card2:#20263380;
  --border:rgba(255,255,255,.07); --text:#f5f6f8; --dim:#9aa3b2; --faint:#5f6878;
  --a:#ff6b35; --a-soft:#ff6b3522; --b:#00c2a8; --b-soft:#00c2a822;
  --success:#34d399; --warn:#fbbf24; --danger:#f87171;
  --radius:20px; --radius-sm:13px; --tabbar-h:64px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f4f5f7; --bg-elev:#ffffff; --card:#ffffff; --card2:#eef0f3aa;
    --border:rgba(0,0,0,.08); --text:#191c22; --dim:#5b6472; --faint:#8b93a1; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
body{padding-bottom:calc(var(--tabbar-h) + var(--safe-b));}
h1,h2,h3,p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{display:none;}
.hidden{display:none !important;}

#app{max-width:520px;margin:0 auto;position:relative;min-height:100vh;}

/* ---------- Top header ---------- */
.topbar{padding:calc(14px + var(--safe-t)) 18px 12px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 75%, transparent); backdrop-filter:blur(6px);}
.topbar h1{font-size:26px;font-weight:800;letter-spacing:-.3px;}
.topbar .sub{color:var(--dim);font-size:13px;margin-top:2px;}

.switcher{display:flex;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px;gap:4px;margin-top:12px;}
.switcher button{flex:1;border:none;background:transparent;color:var(--dim);padding:9px 4px;border-radius:10px;font-size:13.5px;font-weight:700;transition:.2s;}
.switcher button.active{background:var(--accent-bg,var(--a));color:#fff;}
.switcher button.active[data-tone="b"]{background:var(--b);}
.switcher button.active[data-tone="couple"]{background:linear-gradient(135deg,var(--a),var(--b));}

/* ---------- Content ---------- */
.content{padding:6px 18px 28px;}
.section-title{font-size:19px;font-weight:800;margin:22px 0 10px;letter-spacing:-.2px;}
.section-title.first{margin-top:6px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card-row{display:flex;align-items:center;justify-content:space-between;}
.muted{color:var(--dim);font-size:13px;}
.faint{color:var(--faint);font-size:12px;}

/* ---------- Dashboard hero ---------- */
.hero{border-radius:24px;padding:20px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--hero-c1,#ff6b35),var(--hero-c2,#ff9a5a)); color:#fff; margin-bottom:14px;}
.hero .name{font-size:15px;opacity:.85;font-weight:600;}
.hero .weight{font-size:38px;font-weight:800;margin-top:2px;letter-spacing:-1px;}
.hero .delta{font-size:13.5px;margin-top:4px;opacity:.92;font-weight:600;}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.hero-pill{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;}
.hero-pill .v{font-size:18px;font-weight:800;}
.hero-pill .l{font-size:11px;opacity:.85;margin-top:1px;}

.quick-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 20px;}
.quick-btn{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
.quick-btn .ic{font-size:20px;}
.quick-btn .t{font-size:10.5px;font-weight:700;color:var(--dim);}

.ring-wrap{display:flex;align-items:center;gap:16px;}
.ring{position:relative;width:96px;height:96px;flex:none;}
.ring svg{transform:rotate(-90deg);}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .center b{font-size:19px;line-height:1;}
.ring .center span{font-size:9.5px;color:var(--dim);margin-top:2px;}

.macrobar{margin-top:10px;}
.macrobar .row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
.barbg{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;}
.barfg{height:100%;border-radius:6px;transition:width .3s;}

/* ---------- Tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(20,24,33,.86); backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid var(--border); padding-bottom:var(--safe-b);
  max-width:520px;margin:0 auto;}
@media (prefers-color-scheme:light){.tabbar{background:rgba(255,255,255,.86);}}
.tabbar button{flex:1;border:none;background:transparent;color:var(--faint);padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;height:var(--tabbar-h);}
.tabbar button.active{color:var(--a);}
.tabbar .ic{font-size:21px;}
.tabbar .lb{font-size:10px;font-weight:700;}

/* ---------- Buttons / forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;width:100%;background:var(--a);color:#fff;}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn.small{width:auto;padding:9px 14px;font-size:13.5px;border-radius:11px;}
.btn.ghost{background:transparent;color:var(--a);border:1px solid var(--border);}
.btn:disabled{opacity:.4;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--dim);font-weight:700;margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:11px 12px;color:var(--text);font-size:15px;}
.field textarea{resize:vertical;min-height:60px;}
.field-row{display:flex;gap:10px;}
.field-row>.field{flex:1;}
.seg{display:flex;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px;}
.seg button{flex:1;border:none;background:transparent;color:var(--dim);padding:9px 2px;border-radius:9px;font-size:12.5px;font-weight:700;}
.seg button.active{background:var(--a);color:#fff;}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;}
.chip{border:1px solid var(--border);background:var(--bg-elev);color:var(--dim);padding:7px 12px;border-radius:20px;font-size:12.5px;font-weight:700;}
.chip.active{background:var(--a);color:#fff;border-color:var(--a);}

/* ---------- Lists ---------- */
.list-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.list-item .li-l{display:flex;align-items:center;gap:10px;}
.li-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--card2);flex:none;}
.li-name{font-size:14.5px;font-weight:700;}
.li-sub{font-size:12px;color:var(--dim);margin-top:1px;}
.li-r{text-align:right;font-size:13px;font-weight:700;}
.li-del{color:var(--faint);font-size:16px;padding:4px 8px;}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--bg-elev);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 18px calc(20px + var(--safe-b));max-height:88vh;overflow-y:auto;animation:slideup .22s ease;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-head h3{font-size:18px;font-weight:800;}
.modal-close{background:var(--card2);border:none;color:var(--text);width:30px;height:30px;border-radius:50%;font-size:15px;}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-head button{background:var(--card2);border:none;color:var(--text);width:30px;height:30px;border-radius:50%;font-size:15px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;}
.cal-dow{font-size:10.5px;color:var(--faint);font-weight:700;padding-bottom:3px;}
.cal-day{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;background:var(--card2);color:var(--dim);position:relative;}
.cal-day.empty{background:transparent;}
.cal-day.went{background:var(--success);color:#08130e;}
.cal-day.today{box-shadow:0 0 0 2px var(--a) inset;}
.cal-day.future{opacity:.35;}

/* ---------- Stat grid ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat-box{background:var(--card2);border-radius:14px;padding:12px;}
.stat-box .v{font-size:20px;font-weight:800;}
.stat-box .l{font-size:11px;color:var(--dim);margin-top:2px;}

/* ---------- Photos ---------- */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.photo-cell{aspect-ratio:3/4;border-radius:14px;overflow:hidden;position:relative;background:var(--card2);}
.photo-cell img{width:100%;height:100%;object-fit:cover;}
.photo-cell .tag{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:10px;font-weight:700;padding:12px 6px 5px;text-align:center;}
.compare-wrap{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;}
.compare-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.compare-wrap .after{clip-path:inset(0 0 0 50%);}
.compare-slider{position:absolute;inset:0;width:100%;height:100%;-webkit-appearance:none;appearance:none;background:transparent;margin:0;}
.compare-slider::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--a);box-shadow:0 2px 8px rgba(0,0,0,.4);}
.compare-line{position:absolute;top:0;bottom:0;width:3px;background:#fff;left:50%;pointer-events:none;transform:translateX(-50%);}

/* ---------- Goal ---------- */
.goal-bar-bg{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:8px;}
.goal-bar-fg{height:100%;border-radius:6px;}
.achieved-badge{display:inline-block;background:var(--success);color:#052e1c;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:30px 10px;color:var(--faint);}
.empty .ic{font-size:32px;margin-bottom:8px;}
.empty p{font-size:13.5px;}

/* ---------- Onboarding ---------- */
.onb-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 22px calc(24px + var(--safe-b));}
.onb-logo{font-size:44px;text-align:center;margin-bottom:6px;}
.onb-title{font-size:26px;font-weight:800;text-align:center;letter-spacing:-.4px;}
.onb-sub{text-align:center;color:var(--dim);font-size:14px;margin-top:6px;margin-bottom:26px;}
.mode-card{border:1.5px solid var(--border);background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;}
.mode-card.selected{border-color:var(--a);background:var(--a-soft);}
.mode-card .ic{font-size:26px;}
.mode-card h4{font-size:15.5px;font-weight:800;margin-bottom:3px;}
.mode-card p{font-size:12.5px;color:var(--dim);}
.progress-dots{display:flex;gap:5px;justify-content:center;margin-bottom:18px;}
.progress-dots span{width:7px;height:7px;border-radius:50%;background:var(--card2);}
.progress-dots span.on{background:var(--a);width:20px;border-radius:4px;}

.toast{position:fixed;bottom:calc(var(--tabbar-h) + var(--safe-b) + 14px);left:50%;transform:translateX(-50%);
  background:#1c2230;color:#fff;padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:200;border:1px solid rgba(255,255,255,.1);}
</style>

 {k:"peso",l:"Bajar / subir X kg",ic:"⚖️"},

const STORAGE_KEY = "nosotrosfit_v1";

/* ============================= STATE ============================= */
let state = loadState();
function defaultState(){
 return {onboarded:false, mode:null, activeProfileId:null, coupleStartDate:null,
  profiles:{}, weights:[], foodLog:[], attendance:[], workouts:[], photos:[], goals:[],
  ui:{tab:"inicio", scope:"me", trainSub:"asistencia", progSub:"peso", calYear:new Date().getFullYear(), calMonth:new Date().getMonth()}};
}
function loadState(){
 try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw){ const d=JSON.parse(raw); d.ui = d.ui || defaultState().ui; return d; } }catch(e){}
 return defaultState();
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ toast("No se pudo guardar (almacenamiento lleno)"); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){ const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("es-ES",{day:"numeric",month:"short"}); }
function fmtDateLong(s){ const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"}); }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function round1(v){ return Math.round(v*10)/10; }

/* ============================= DERIVED ============================= */
function profileIds(){ return Object.keys(state.profiles); }
function getProfile(id){ return state.profiles[id]; }
function getActiveProfile(){ return state.profiles[state.activeProfileId]; }
function getPartnerId(){ const ids=profileIds(); return ids.find(id=>id!==state.activeProfileId); }
function profileColor(id){ const idx = profileIds().indexOf(id); return PROFILE_COLORS[idx===-1?0:idx]; }

function calcTDEE(profile){
 const {weight, height, age, sex, activity} = {weight:profile.currentWeight, height:profile.height, age:profile.age, sex:profile.sex, activity:profile.activityLevel};
 let tmb = sex==="M" ? (10*weight + 6.25*height - 5*age + 5) : (10*weight + 6.25*height - 5*age - 161);
 const lvl = ACTIVITY_LEVELS.find(l=>l.k===activity) || ACTIVITY_LEVELS[1];
 return tmb * lvl.m;
}
function calcCalorieTarget(profile){
 const tdee = calcTDEE(profile);
 const obj = GOALS_OBJ.find(o=>o.k===profile.objective) || GOALS_OBJ[1];
 return Math.round(tdee + obj.adj);
}
function calcMacroTargets(profile){
 const kcal = calcCalorieTarget(profile);
 // protein 1.8g/kg, fat 25% kcal, rest carbs
 const protein = Math.round(profile.currentWeight * 1.8);
 const fatKcal = kcal*0.25; const fat = Math.round(fatKcal/9);
 const carbKcal = kcal - protein*4 - fatKcal; const carbs = Math.round(Math.max(carbKcal,0)/4);
 return {kcal, protein, carbs, fat};
}
function nutritionToday(profileId, date){
 date = date || todayStr();
 const entries = state.foodLog.filter(e=>e.profileId===profileId && e.date===date);
 const sum = entries.reduce((a,e)=>({kcal:a.kcal+e.kcal, protein:a.protein+e.protein, carbs:a.carbs+e.carbs, fat:a.fat+e.fat}),{kcal:0,protein:0,carbs:0,fat:0});
 return {entries, sum};
}
function weightStats(profileId){
 const list = state.weights.filter(w=>w.profileId===profileId).sort((a,b)=>a.date.localeCompare(b.date));
 const profile = getProfile(profileId);
 const current = list.length ? list[list.length-1].weight : profile.currentWeight;
 const initial = profile.initialWeight;
 const prev = list.length>1 ? list[list.length-2].weight : initial;
 return {list, current, initial, deltaStart: round1(current-initial), deltaLast: round1(current-prev)};
}
function attendanceStats(profileId){
 const dates = state.attendance.filter(a=>a.profileId===profileId).map(a=>a.date).sort();
 const set = new Set(dates);
 // current streak (consecutive days up to today or yesterday)
 let streak=0; let cursor=new Date();
 for(;;){ const ds=cursor.toISOString().slice(0,10); if(set.has(ds)){streak++; cursor.setDate(cursor.getDate()-1);} else if(ds===todayStr()){cursor.setDate(cursor.getDate()-1); continue;} else break; }
 // best streak
 let best=0, run=0, prevD=null;
 dates.forEach(d=>{ if(prevD && daysBetween(prevD,d)===1) run++; else run=1; if(run>best) best=run; prevD=d; });
 const now = new Date(); const thisMonth = dates.filter(d=>{ const dd=new Date(d+"T00:00:00"); return dd.getFullYear()===now.getFullYear() && dd.getMonth()===now.getMonth(); }).length;
 const start = getProfile(profileId).startDate || dates[0] || todayStr();
 const totalDaysSince = Math.max(1, daysBetween(start, todayStr())+1);
 const pct = Math.round((dates.length/totalDaysSince)*100);
 const last24start = new Date(); last24start.setDate(last24start.getDate()-23);
 const last24count = dates.filter(d=> new Date(d+"T00:00:00") >= last24start).length;
 return {dates, total:dates.length, streak, best, thisMonth, pct:clamp(pct,0,100), last24count};
}
function exerciseHistory(profileId, exercise){
 return state.workouts.filter(w=>w.profileId===profileId && w.exercise===exercise).sort((a,b)=>a.date.localeCompare(b.date));
}
function coupleStats(){
 const ids = profileIds(); if(ids.length<2) return null;
 const [a,b] = ids;
 const attA = new Set(state.attendance.filter(x=>x.profileId===a).map(x=>x.date));
 const attB = new Set(state.attendance.filter(x=>x.profileId===b).map(x=>x.date));
 const together = [...attA].filter(d=>attB.has(d)).sort();
 let streak=0; let cursor=new Date();
 for(;;){ const ds=cursor.toISOString().slice(0,10); if(together.includes(ds)){streak++; cursor.setDate(cursor.getDate()-1);} else if(ds===todayStr()){cursor.setDate(cursor.getDate()-1); continue;} else break; }
 const start = state.coupleStartDate || todayStr();
 const daysSince = Math.max(0, daysBetween(start, todayStr()));
 return {jointDays:together.length, streak, daysSince, totalA:attA.size, totalB:attB.size};
}

}
function toast(msg){

 document.body.appendChild(el); setTimeout(()=>el.remove(),2200);
}

 if(onbState.step===2 && onbState.mode==="pareja") return onbStepProfile(1);
 return onbStepDone();
}

  <div class="field"><label>Nivel de actividad</label><select id="f_activity">${ACTIVITY_LEVELS.map(a=>`<option value="${a.k}" ${p.activity===a.k?'selected':''}>${a.l} — ${a.d}</option>`).join('')}</select></div>

}
function onbStepDone(){
 return `<div class="onb-wrap" style="text-align:center">
  <div class="onb-logo">🎉</div>
  <div class="onb-title">Todo listo</div>
  <div class="onb-sub">Su espacio de progreso esta configurado.</div>
  <button class="btn" id="onbFinish">Ir al dashboard</button>
 </div>`;
}
function bindOnboarding(){
 const modeCards = app.querySelectorAll(".mode-card");
 modeCards.forEach(c=>c.addEventListener("click",()=>{ onbState.mode=c.dataset.mode; render(); }));
 const next = document.getElementById("onbNext");
 if(next) next.addEventListener("click", ()=>{
  if(onbState.step===0){ onbState.step=1; render(); return; }
  const idx = onbState.step-1;
  const name=document.getElementById("f_name").value.trim();
  if(!name){ toast("Escribe un nombre"); return; }
  onbState.profiles[idx] = {
   name, age:+document.getElementById("f_age").value||25, sex:document.getElementById("f_sex").value,
   height:+document.getElementById("f_height").value||170, weight:+document.getElementById("f_weight").value||70,
   goalWeight:document.getElementById("f_goalweight").value? +document.getElementById("f_goalweight").value : null,
   objective:document.getElementById("f_objective").value, activity:document.getElementById("f_activity").value,
   start:document.getElementById("f_start").value||todayStr(),
  };
  if(onbState.mode==="pareja" && idx===0){ onbState.step=2; render(); return; }
  finalizeOnboarding();
 });
 const back = document.getElementById("onbBack");
 if(back) back.addEventListener("click", ()=>{ onbState.step = onbState.step>0? onbState.step-1:0; render(); });
 const finish = document.getElementById("onbFinish");
 if(finish) finish.addEventListener("click", ()=>{ state.onboarded=true; saveState(); render(); });
}
function finalizeOnboarding(){
 state.mode = onbState.mode;
 state.profiles = {};
 onbState.profiles.slice(0, onbState.mode==="pareja"?2:1).forEach(p=>{
  const id = uid();
  state.profiles[id] = {name:p.name, age:p.age, sex:p.sex, height:p.height, initialWeight:p.weight, currentWeight:p.weight,
   goalWeight:p.goalWeight, objective:p.objective, activityLevel:p.activity, startDate:p.start};
 });
 const ids = Object.keys(state.profiles);
 state.activeProfileId = ids[0];
 if(state.mode==="pareja") state.coupleStartDate = todayStr();
 state.weights.push({id:uid(), profileId:ids[0], date:onbState.profiles[0].start, weight:onbState.profiles[0].weight});
 if(ids[1]) state.weights.push({id:uid(), profileId:ids[1], date:onbState.profiles[1].start, weight:onbState.profiles[1].weight});
 saveState();
 onbState.step = state.mode==="pareja"?3:2;
 render();
}

  {k:"entreno",ic:"🏋️",l:"Entreno"},{k:"progreso",ic:"📈",l:"Progreso"},{k:"perfil",ic:"👤",l:"Perfil"}];

 return `${body}

function bindShell(){
 app.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{ state.ui.tab=b.dataset.tab; render(); window.scrollTo(0,0); }));

 bindTabSpecific();

function ringSvg(pct, color){
 const p = clamp(pct,0,100); const r=40, c=2*Math.PI*r, off=c-(c*p/100);

function goalTitle(g){
 const t = GOAL_TYPES.find(x=>x.k===g.type);
 if(g.type==="peso") return `Bajar/subir ${Math.abs(g.target-g.startValue)} kg`;
 if(g.type==="pesoobjetivo") return `Llegar a ${g.target} kg`;
 if(g.type==="asistencia") return `Asistir ${g.target} dias`;
 if(g.type==="racha") return `Mantener una racha de ${g.target} dias`;
 if(g.type==="proteina") return `Consumir ${g.target} g de proteina/dia`;
 if(g.type==="ejercicio") return `Mejorar ${g.exercise} a ${g.target} kg`;
 return t?.l||"Meta";
}
function goalCurrentValue(g){
 if(g.type==="peso"||g.type==="pesoobjetivo"){ return weightStats(g.profileId).current; }
 if(g.type==="asistencia"){ return state.attendance.filter(a=>a.profileId===g.profileId && a.date>=g.createdDate).length; }
 if(g.type==="racha"){ return attendanceStats(g.profileId).streak; }
 if(g.type==="proteina"){ return Math.round(nutritionToday(g.profileId).sum.protein); }
 if(g.type==="ejercicio"){ const h=exerciseHistory(g.profileId, g.exercise); return h.length? h[h.length-1].weight : g.startValue; }
 return 0;
}
function goalPct(g){
 const cur = goalCurrentValue(g);
 if(g.type==="peso"||g.type==="pesoobjetivo"||g.type==="ejercicio"){
  const span = Math.abs(g.target-g.startValue)||1; const done = g.target>=g.startValue? (cur-g.startValue) : (g.startValue-cur);
  return clamp(Math.round(done/span*100),0,100);
 }
 return clamp(Math.round(cur/g.target*100),0,100);
}
function goalProgressLabel(g){
 if(g.type==="peso"||g.type==="pesoobjetivo"||g.type==="ejercicio") return `${goalCurrentValue(g)} / ${g.target}`;
 return `${goalCurrentValue(g)} / ${g.target}`;
}

function renderCalendarGrid(pid,y,m){

 }

function lineChartSvg(values, color){
 if(values.length<2) return '';
 const w=280,h=64,pad=6; const min=Math.min(...values),max=Math.max(...values);
 const range = (max-min)||1;
 const pts = values.map((v,i)=>{ const x=pad+(i/(values.length-1))*(w-pad*2); const y=h-pad-((v-min)/range)*(h-pad*2); return `${x},${y}`; }).join(' ');
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:64px" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function openModal(html){

 const bg=document.createElement("div"); bg.className="modal-bg"; bg.id="modalBg";
 bg.innerHTML = `<div class="modal">${html}</div>`;
 bg.addEventListener("click",(e)=>{ if(e.target.id==="modalBg") closeModal(); });
 document.body.appendChild(bg);
 bindModalActions();
}
function closeModal(){ const m=document.getElementById("modalBg"); if(m) m.remove(); }

function openQuick(type){
 const pid = state.ui.scope==="partner"? getPartnerId() : state.activeProfileId;
 if(type==="asistencia"){ toggleAttendance(pid, todayStr()); return; }
 if(type==="comida"){ openAddFoodModal(pid,"desayuno"); return; }
 if(type==="peso"){ openLogWeightModal(pid); return; }
 if(type==="entreno"){ openAddWorkoutModal(pid); return; }
 if(type==="fotos"){ state.ui.tab="progreso"; state.ui.progSub="fotos"; render(); return; }
 if(type==="fotoadd"){ openAddPhotoModal(pid); return; }
 if(type==="meta"){ openAddGoalModal(pid); return; }
}
function toggleAttendance(pid, date){
 const exists = state.attendance.find(a=>a.profileId===pid && a.date===date);
 if(exists){ state.attendance = state.attendance.filter(a=>a!==exists); toast("Asistencia eliminada"); }
 else { state.attendance.push({id:uid(), profileId:pid, date}); toast(date===todayStr()? "¡Asistencia registrada! 💪" : "Asistencia agregada"); }
 saveState(); render();
}

let currentFoodCat=null, selectedFood=null;
function renderFoodResults(q, cat){
 currentFoodCat = cat;
 const el = document.getElementById("mFoodResults"); if(!el) return;
 const ql = q.toLowerCase();
 const results = FOOD_DB.filter(f=> (!cat||f.c===cat) && f.n.toLowerCase().includes(ql)).slice(0,30);
 el.innerHTML = results.map(f=>`<div class="list-item" data-pickfood="${f.n}" style="cursor:pointer">
   <div class="li-l"><div class="li-ic">🍴</div><div><div class="li-name">${f.n}</div><div class="li-sub">${f.k} kcal / 100${f.unit?'g · o '+f.g+'g por '+f.unit:'g'}</div></div></div><span class="faint">+</span>
  </div>`).join('') || `<div class="faint" style="padding:8px 0">Sin resultados</div>`;
 el.querySelectorAll("[data-pickfood]").forEach(r=>r.addEventListener("click",()=>pickFood(r.dataset.pickfood)));
 app.querySelectorAll("#mFoodCats .chip").forEach(c=>{
  c.classList.toggle("active", c.dataset.cat===cat);
  c.onclick = ()=>renderFoodResults(document.getElementById("mFoodSearch").value, cat===c.dataset.cat? null : c.dataset.cat);
 });
}
function pickFood(name){
 selectedFood = FOOD_DB.find(f=>f.n===name);
 const unitLabel = selectedFood.unit || "g";
 const defaultQty = selectedFood.unit? 1 : 100;
 document.getElementById("mFoodDetail").innerHTML = `
  <div class="card">
   <b>${selectedFood.n}</b>
   <div class="field-row" style="margin-top:10px">
    <div class="field"><label>Cantidad</label><input id="mFoodQty" type="number" step="any" value="${defaultQty}"></div>
    <div class="field"><label>Unidad</label><input value="${unitLabel}" disabled></div>
   </div>
   <div class="faint" id="mFoodCalc"></div>
   <button class="btn" id="mFoodConfirm" style="margin-top:8px">Agregar</button>
  </div>`;
 const recalc = ()=>{
  const qty = +document.getElementById("mFoodQty").value || 0;
  const grams = selectedFood.unit? qty*selectedFood.g : qty;
  const factor = grams/100;
  const kcal=Math.round(selectedFood.k*factor), pr=selectedFood.p*factor, cb=selectedFood.cb*factor, ft=selectedFood.f*factor;
  document.getElementById("mFoodCalc").textContent = `${kcal} kcal · P${round1(pr)}g C${round1(cb)}g G${round1(ft)}g`;
 };
 recalc();
 document.getElementById("mFoodQty").addEventListener("input", recalc);
 document.getElementById("mFoodConfirm").addEventListener("click", ()=>{
  const pid = state.ui.scope==="partner"? getPartnerId() : state.activeProfileId;
  const meal = document.getElementById("mFoodMeal").value;
  const qty = +document.getElementById("mFoodQty").value || 0;
  const grams = selectedFood.unit? qty*selectedFood.g : qty;
  const factor = grams/100;
  state.foodLog.push({id:uid(), profileId:pid, date:todayStr(), meal, food:selectedFood.n, qty, unitLabel,
   kcal:Math.round(selectedFood.k*factor), protein:selectedFood.p*factor, carbs:selectedFood.cb*factor, fat:selectedFood.f*factor});
  saveState(); closeModal(); toast("Alimento agregado"); render();
 });
}

function resizeImage(file, cb){
 const reader = new FileReader();
 reader.onload = (ev)=>{
  const img = new Image();
  img.onload = ()=>{
   const maxW=900; const scale=Math.min(1,maxW/img.width);
   const canvas=document.createElement("canvas"); canvas.width=img.width*scale; canvas.height=img.height*scale;
   canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
   cb(canvas.toDataURL("image/jpeg",0.72));
  };
  img.src = ev.target.result;
 };
 reader.readAsDataURL(file);
}

function openAddGoalModal(pid){
 openModal(`
  <div class="modal-head"><h3>Nueva meta</h3><button class="modal-close" data-close-modal>✕</button></div>
  <div class="field"><label>Tipo de meta</label><select id="mGoalType">${GOAL_TYPES.map(g=>`<option value="${g.k}">${g.ic} ${g.l}</option>`).join('')}</select></div>
  <div id="mGoalExtra"></div>
  <button class="btn" id="mGoalSave">Crear meta</button>`);
 const typeSel = document.getElementById("mGoalType");
 const extra = document.getElementById("mGoalExtra");
 const objective = getProfile(pid).objective;
 const updateExtra=()=>{
  const t = typeSel.value;
  let html = "";
  if(t==="ejercicio"){
   html += `<div class="field"><label>Ejercicio</label><select id="mGoalExercise">${Object.values(EXERCISES_BY_GROUP).flat().map(e=>`<option>${e}</option>`).join('')}</select></div>`;
  }
  if(t==="peso"){
   html += `<div class="field"><label>Direccion</label><div class="seg"><button type="button" data-dir="bajar" class="active">Bajar</button><button type="button" data-dir="subir">Subir</button></div></div>
    <div class="field"><label>Cuantos kg</label><input id="mGoalTarget" type="number" step="0.1" min="0"></div>`;
  } else {
   html += `<div class="field"><label>${GOAL_TARGET_LABEL[t]}</label><input id="mGoalTarget" type="number" step="0.1"></div>`;
  }
  extra.innerHTML = html;
  const dirBtns = extra.querySelectorAll("[data-dir]");
  if(dirBtns.length){
   if(objective==="ganar") dirBtns[1].classList.add("active"), dirBtns[0].classList.remove("active");
   dirBtns.forEach(b=>b.addEventListener("click",()=>{ dirBtns.forEach(x=>x.classList.remove("active")); b.classList.add("active"); }));
  }
 };
 updateExtra(); typeSel.addEventListener("change", updateExtra);
 document.getElementById("mGoalSave").addEventListener("click", ()=>{
  const type=typeSel.value; const rawTarget=+document.getElementById("mGoalTarget").value;
  if(!rawTarget && rawTarget!==0){ toast("Ingresa un valor"); return; }
  let startValue=0, exercise=null, target=rawTarget;
  if(type==="peso"||type==="pesoobjetivo") startValue = weightStats(pid).current;
  if(type==="peso"){
   const dir = extra.querySelector('[data-dir].active')?.dataset.dir || "bajar";
   target = dir==="bajar"? round1(startValue-rawTarget) : round1(startValue+rawTarget);
  }
  if(type==="ejercicio"){ exercise=document.getElementById("mGoalExercise").value; const h=exerciseHistory(pid,exercise); startValue = h.length? h[h.length-1].weight : 0; }
  state.goals.push({id:uid(), profileId:pid, type, target, exercise, startValue, achieved:false, createdDate:todayStr()});
  saveState(); closeModal(); toast("Meta creada"); render();
 });
}

function bindTabSpecific(){

  app.querySelectorAll("[data-addfood]").forEach(b=>b.addEventListener("click",()=>openAddFoodModal(scopedProfileId(), b.dataset.addfood)));

   const d=new Date((nutHistoryDate||todayStr())+"T00:00:00"); d.setDate(d.getDate()+ (+b.dataset.daynav));
   const ds=d.toISOString().slice(0,10); nutHistoryDate = ds>todayStr()? todayStr() : ds; render();

   let m=state.ui.calMonth+(+b.dataset.calnav), y=state.ui.calYear; if(m<0){m=11;y--;} if(m>11){m=0;y++;} state.ui.calMonth=m; state.ui.calYear=y; render();
  }));
  app.querySelectorAll("[data-toggleday]").forEach(b=>b.addEventListener("click",()=>toggleAttendance(b.dataset.pid, b.dataset.toggleday)));
  app.querySelectorAll("[data-delworkout]").forEach(b=>b.addEventListener("click",()=>{ state.workouts=state.workouts.filter(w=>w.id!==b.dataset.delworkout); saveState(); render(); }));
 }

  app.querySelectorAll("[data-sub2]").forEach(b=>b.addEventListener("click",()=>{ state.ui.progSub=b.dataset.sub2; render(); }));
  app.querySelectorAll("[data-delweight]").forEach(b=>b.addEventListener("click",()=>{ state.weights=state.weights.filter(w=>w.id!==b.dataset.delweight); saveState(); render(); }));
  app.querySelectorAll("[data-delgoal]").forEach(b=>b.addEventListener("click",()=>{ state.goals=state.goals.filter(g=>g.id!==b.dataset.delgoal); saveState(); render(); }));
  app.querySelectorAll("[data-photoview]").forEach(b=>b.addEventListener("click",()=>openPhotoDetail(b.dataset.photoview)));

  const sw = app.querySelector("[data-switchprofile]"); if(sw) sw.addEventListener("click",()=>{ state.activeProfileId=getPartnerId(); state.ui.scope="me"; toast("Cambiaste de perfil"); render(); });
  const addp = app.querySelector("[data-addpartner]"); if(addp) addp.addEventListener("click", openAddPartnerModal);
  app.querySelectorAll("[data-openhist]").forEach(b=>b.addEventListener("click",()=>openHistoryModal(b.dataset.openhist, state.activeProfileId)));
  const exp = app.querySelector("[data-exportdata]"); if(exp) exp.addEventListener("click", exportData);
  const imp = app.querySelector("[data-importdata]"); if(imp) imp.addEventListener("click", importData);
 }
}
function exportData(){
 const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
 const url = URL.createObjectURL(blob);
 const a = document.createElement("a"); a.href=url; a.download=`nosotrosfit_backup_${todayStr()}.json`; a.click();
 URL.revokeObjectURL(url);
}
function importData(){
 const input = document.createElement("input"); input.type="file"; input.accept="application/json";
 input.addEventListener("change",()=>{
  const f=input.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{ try{ const d=JSON.parse(ev.target.result); state=d; saveState(); toast("Datos importados"); render(); }catch(e){ toast("Archivo invalido"); } };
  reader.readAsText(f);
 });
 input.click();
}

render();
})();
</script>
</body>
