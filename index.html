<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Nosotros Fit</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#0b0e14; --bg-elev:#12151d; --card:#1a1f2b; --card2:#20263380;
  --border:rgba(255,255,255,.07); --text:#f5f6f8; --dim:#9aa3b2; --faint:#5f6878;
  --a:#ff6b35; --a-soft:#ff6b3522; --b:#00c2a8; --b-soft:#00c2a822;
  --success:#34d399; --warn:#fbbf24; --danger:#f87171;
  --radius:20px; --radius-sm:13px; --tabbar-h:64px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f4f5f7; --bg-elev:#ffffff; --card:#ffffff; --card2:#eef0f3aa;
    --border:rgba(0,0,0,.08); --text:#191c22; --dim:#5b6472; --faint:#8b93a1; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
body{padding-bottom:calc(var(--tabbar-h) + var(--safe-b));}
h1,h2,h3,p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{display:none;}
.hidden{display:none !important;}

#app{max-width:520px;margin:0 auto;position:relative;min-height:100vh;}

/* ---------- Top header ---------- */
.topbar{padding:calc(14px + var(--safe-t)) 18px 12px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 75%, transparent); backdrop-filter:blur(6px);}
.topbar h1{font-size:26px;font-weight:800;letter-spacing:-.3px;}
.topbar .sub{color:var(--dim);font-size:13px;margin-top:2px;}

.switcher{display:flex;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px;gap:4px;margin-top:12px;}
.switcher button{flex:1;border:none;background:transparent;color:var(--dim);padding:9px 4px;border-radius:10px;font-size:13.5px;font-weight:700;transition:.2s;}
.switcher button.active{background:var(--accent-bg,var(--a));color:#fff;}
.switcher button.active[data-tone="b"]{background:var(--b);}
.switcher button.active[data-tone="couple"]{background:linear-gradient(135deg,var(--a),var(--b));}

/* ---------- Content ---------- */
.content{padding:6px 18px 28px;}
.section-title{font-size:19px;font-weight:800;margin:22px 0 10px;letter-spacing:-.2px;}
.section-title.first{margin-top:6px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card-row{display:flex;align-items:center;justify-content:space-between;}
.muted{color:var(--dim);font-size:13px;}
.faint{color:var(--faint);font-size:12px;}

/* ---------- Dashboard hero ---------- */
.hero{border-radius:24px;padding:20px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--hero-c1,#ff6b35),var(--hero-c2,#ff9a5a)); color:#fff; margin-bottom:14px;}
.hero .name{font-size:15px;opacity:.85;font-weight:600;}
.hero .weight{font-size:38px;font-weight:800;margin-top:2px;letter-spacing:-1px;}
.hero .delta{font-size:13.5px;margin-top:4px;opacity:.92;font-weight:600;}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.hero-pill{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;}
.hero-pill .v{font-size:18px;font-weight:800;}
.hero-pill .l{font-size:11px;opacity:.85;margin-top:1px;}

.quick-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 20px;}
.quick-btn{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
.quick-btn .ic{font-size:20px;}
.quick-btn .t{font-size:10.5px;font-weight:700;color:var(--dim);}

.ring-wrap{display:flex;align-items:center;gap:16px;}
.ring{position:relative;width:96px;height:96px;flex:none;}
.ring svg{transform:rotate(-90deg);}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .center b{font-size:19px;line-height:1;}
.ring .center span{font-size:9.5px;color:var(--dim);margin-top:2px;}

.macrobar{margin-top:10px;}
.macrobar .row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
.barbg{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;}
.barfg{height:100%;border-radius:6px;transition:width .3s;}

/* ---------- Tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(20,24,33,.86); backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid var(--border); padding-bottom:var(--safe-b);
  max-width:520px;margin:0 auto;}
@media (prefers-color-scheme:light){.tabbar{background:rgba(255,255,255,.86);}}
.tabbar button{flex:1;border:none;background:transparent;color:var(--faint);padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;height:var(--tabbar-h);}
.tabbar button.active{color:var(--a);}
.tabbar .ic{font-size:21px;}
.tabbar .lb{font-size:10px;font-weight:700;}

/* ---------- Buttons / forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;width:100%;background:var(--a);color:#fff;}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn.small{width:auto;padding:9px 14px;font-size:13.5px;border-radius:11px;}
.btn.ghost{background:transparent;color:var(--a);border:1px solid var(--border);}
.btn:disabled{opacity:.4;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--dim);font-weight:700;margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:11px 12px;color:var(--text);font-size:15px;}
.field textarea{resize:vertical;min-height:60px;}
.field-row{display:flex;gap:10px;}
.field-row>.field{flex:1;}
.seg{display:flex;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px;}
.seg button{flex:1;border:none;background:transparent;color:var(--dim);padding:9px 2px;border-radius:9px;font-size:12.5px;font-weight:700;}
.seg button.active{background:var(--a);color:#fff;}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;}
.chip{border:1px solid var(--border);background:var(--bg-elev);color:var(--dim);padding:7px 12px;border-radius:20px;font-size:12.5px;font-weight:700;}
.chip.active{background:var(--a);color:#fff;border-color:var(--a);}

/* ---------- Lists ---------- */
.list-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);gap:8px;}
.list-item:last-child{border-bottom:none;}
.list-item .li-l{display:flex;align-items:center;gap:10px;}
.li-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--card2);flex:none;}
.li-name{font-size:14.5px;font-weight:700;}
.li-sub{font-size:12px;color:var(--dim);margin-top:1px;}
.li-r{text-align:right;font-size:13px;font-weight:700;}
.li-del{color:var(--faint);font-size:16px;padding:4px 8px;}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--bg-elev);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 18px calc(20px + var(--safe-b));max-height:88vh;overflow-y:auto;animation:slideup .22s ease;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-head h3{font-size:18px;font-weight:800;}
.modal-close{background:var(--card2);border:none;color:var(--text);width:30px;height:30px;border-radius:50%;font-size:15px;}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-head button{background:var(--card2);border:none;color:var(--text);width:30px;height:30px;border-radius:50%;font-size:15px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;}
.cal-dow{font-size:10.5px;color:var(--faint);font-weight:700;padding-bottom:3px;}
.cal-day{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;background:var(--card2);color:var(--dim);position:relative;}
.cal-day.empty{background:transparent;}
.cal-day.went{background:var(--success);color:#08130e;}
.cal-day.today{box-shadow:0 0 0 2px var(--a) inset;}
.cal-day.future{opacity:.35;}

/* ---------- Stat grid ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat-box{background:var(--card2);border-radius:14px;padding:12px;}
.stat-box .v{font-size:20px;font-weight:800;}
.stat-box .l{font-size:11px;color:var(--dim);margin-top:2px;}

/* ---------- Photos ---------- */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.photo-cell{aspect-ratio:3/4;border-radius:14px;overflow:hidden;position:relative;background:var(--card2);}
.photo-cell img{width:100%;height:100%;object-fit:cover;}
.photo-cell .tag{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:10px;font-weight:700;padding:12px 6px 5px;text-align:center;}
.compare-wrap{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;}
.compare-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.compare-wrap .after{clip-path:inset(0 0 0 50%);}
.compare-slider{position:absolute;inset:0;width:100%;height:100%;-webkit-appearance:none;appearance:none;background:transparent;margin:0;}
.compare-slider::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--a);box-shadow:0 2px 8px rgba(0,0,0,.4);}
.compare-line{position:absolute;top:0;bottom:0;width:3px;background:#fff;left:50%;pointer-events:none;transform:translateX(-50%);}

/* ---------- Goal ---------- */
.goal-bar-bg{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:8px;}
.goal-bar-fg{height:100%;border-radius:6px;}
.achieved-badge{display:inline-block;background:var(--success);color:#052e1c;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:30px 10px;color:var(--faint);}
.empty .ic{font-size:32px;margin-bottom:8px;}
.empty p{font-size:13.5px;}

/* ---------- Onboarding / Login ---------- */
.onb-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 22px calc(24px + var(--safe-b));}
.onb-logo{font-size:44px;text-align:center;margin-bottom:6px;}
.onb-title{font-size:26px;font-weight:800;text-align:center;letter-spacing:-.4px;}
.onb-sub{text-align:center;color:var(--dim);font-size:14px;margin-top:6px;margin-bottom:26px;}
.progress-dots{display:flex;gap:5px;justify-content:center;margin-bottom:18px;}
.progress-dots span{width:7px;height:7px;border-radius:50%;background:var(--card2);}
.progress-dots span.on{background:var(--a);width:20px;border-radius:4px;}

.toast{position:fixed;bottom:calc(var(--tabbar-h) + var(--safe-b) + 14px);left:50%;transform:translateX(-50%);
  background:#1c2230;color:#fff;padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:200;border:1px solid rgba(255,255,255,.1);max-width:88%;text-align:center;}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){
"use strict";

/* ============================= SUPABASE ============================= */
const SUPABASE_URL = "https://xpjhyfwqjdadcvogwfju.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwamh5ZndxamRhZGN2b2d3Zmp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NjEzMTIsImV4cCI6MjEwMjAzNzMxMn0.wOjwRfyUACi_K0SeKBC9s8Hc2AAkXWp8fnYmmQqR8FM";
const PHOTOS_BUCKET = "progress-photos";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================= STATIC DATA ============================= */
const FOOD_CATS = ["Proteina","Carbohidrato","Fruta","Verdura","Lacteo","Grasa","Snack","Bebida"];
const MEAL_TYPES = [{k:"desayuno",l:"Desayuno",ic:"🌅"},{k:"almuerzo",l:"Almuerzo",ic:"🍽️"},{k:"cena",l:"Cena",ic:"🌙"},{k:"snack",l:"Snacks",ic:"🍎"},{k:"bebida",l:"Bebidas",ic:"🥤"}];
const ACTIVITY_LEVELS = [
 {k:"sedentario",l:"Sedentario",d:"Poco o ningun ejercicio",m:1.2},
 {k:"ligero",l:"Ligero",d:"Ejercicio 1-3 dias/semana",m:1.375},
 {k:"moderado",l:"Moderado",d:"Ejercicio 3-5 dias/semana",m:1.55},
 {k:"activo",l:"Activo",d:"Ejercicio 6-7 dias/semana",m:1.725},
 {k:"muyactivo",l:"Muy activo",d:"Ejercicio intenso diario / fisico",m:1.9},
];
const GOALS_OBJ = [
 {k:"perder",l:"Perder peso",adj:-450},
 {k:"mantener",l:"Mantener peso",adj:0},
 {k:"ganar",l:"Ganar musculo",adj:350},
];
const MUSCLE_GROUPS = ["Pecho","Espalda","Piernas","Hombros","Brazos","Core","Cardio"];
const EXERCISES_BY_GROUP = {
 Pecho:["Press de banca","Press inclinado","Aperturas","Fondos","Press con mancuernas"],
 Espalda:["Dominadas","Remo con barra","Jalon al pecho","Remo con mancuerna","Peso muerto"],
 Piernas:["Sentadilla","Prensa","Zancadas","Extension de cuadriceps","Curl femoral","Peso muerto rumano"],
 Hombros:["Press militar","Elevaciones laterales","Elevaciones frontales","Pajaros"],
 Brazos:["Curl de biceps","Press frances","Curl martillo","Extension de triceps"],
 Core:["Plancha","Crunch","Elevacion de piernas","Russian twist"],
 Cardio:["Cinta","Bicicleta","Eliptica","Remo","Escaladora"],
};
const PROFILE_COLORS = ["#ff6b35","#00c2a8"];
const PHOTO_LABELS = ["Dia 1","Semana 2","Mes 1","Mes 2","Mes 3","Mes 4","Mes 5","Mes 6","Mes 9","Mes 12","Otro"];
const GOAL_TYPES = [
 {k:"peso",l:"Bajar / subir X kg",ic:"⚖️"},
 {k:"pesoobjetivo",l:"Llegar a un peso especifico",ic:"🎯"},
 {k:"asistencia",l:"Asistir X dias al gimnasio",ic:"📅"},
 {k:"racha",l:"Mantener una racha de X dias",ic:"🔥"},
 {k:"proteina",l:"Consumir X g de proteina/dia",ic:"🍗"},
 {k:"ejercicio",l:"Mejorar peso en un ejercicio",ic:"💪"},
];
const GOAL_TARGET_LABEL = {pesoobjetivo:"Peso objetivo (kg)", asistencia:"Dias a asistir", racha:"Dias de racha seguidos", proteina:"Gramos de proteina al dia", ejercicio:"Peso objetivo en el ejercicio (kg)"};

/* ============================= STATE ============================= */
let state = {
 myId:null, isAdmin:false, profiles:{}, foods:[], weights:[], foodLog:[], attendance:[], workouts:[], photos:[], goals:[],
 ui:{tab:"inicio", scope:"me", trainSub:"asistencia", progSub:"peso", calYear:new Date().getFullYear(), calMonth:new Date().getMonth()}
};
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){ const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("es-ES",{day:"numeric",month:"short"}); }
function fmtDateLong(s){ const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"}); }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function round1(v){ return Math.round(v*10)/10; }

/* ============================= MAPPERS (DB row -> app shape) ============================= */
function mapProfile(r){ return {id:r.id, name:r.name, age:r.age, sex:r.sex, height:r.height, initialWeight:Number(r.initial_weight), currentWeight:Number(r.current_weight), goalWeight:r.goal_weight!=null?Number(r.goal_weight):null, objective:r.objective, activityLevel:r.activity_level, startDate:r.start_date, createdAt:r.created_at, avatarUrl:r.avatar_url||null}; }
function mapFood(r){ return {id:r.id, n:r.name, c:r.category, unit:r.unit_label, g:r.grams_per_unit?Number(r.grams_per_unit):null, k:Number(r.kcal), p:Number(r.protein), cb:Number(r.carbs), f:Number(r.fat)}; }
function mapWeight(r){ return {id:r.id, profileId:r.user_id, date:r.date, weight:Number(r.weight)}; }
function mapFoodLog(r){ return {id:r.id, profileId:r.user_id, date:r.date, meal:r.meal, food:r.food_name, qty:Number(r.qty), unitLabel:r.unit_label, kcal:Number(r.kcal), protein:Number(r.protein), carbs:Number(r.carbs), fat:Number(r.fat)}; }
function mapAttendance(r){ return {id:r.id, profileId:r.user_id, date:r.date}; }
function mapWorkout(r){ return {id:r.id, profileId:r.user_id, date:r.date, muscleGroup:r.muscle_group, exercise:r.exercise, sets:r.sets, reps:r.reps, weight:Number(r.weight)}; }
function mapGoal(r){ return {id:r.id, profileId:r.user_id, type:r.type, target:Number(r.target), exercise:r.exercise, startValue:r.start_value!=null?Number(r.start_value):0, achieved:r.achieved, achievedDate:r.achieved_date, createdDate:r.created_date}; }

/* ============================= DERIVED ============================= */
function profileIds(){ return Object.keys(state.profiles); }
function getProfile(id){ return state.profiles[id]; }
function isPareja(){ return profileIds().length >= 2; }
function getPartnerId(){ return profileIds().find(id=>id!==state.myId); }
function isMine(pid){ return pid === state.myId; }
function profileColor(id){ const idx = profileIds().indexOf(id); return PROFILE_COLORS[idx===-1?0:idx]; }
function coupleStartDateStr(){
 const ids = profileIds(); if(ids.length<2) return todayStr();
 const a=state.profiles[ids[0]], b=state.profiles[ids[1]];
 return ((a.createdAt||'')>(b.createdAt||'') ? a.createdAt : b.createdAt || todayStr()).slice(0,10);
}

function calcTDEE(profile){
 const {currentWeight:weight, height, age, sex, activityLevel:activity} = profile;
 let tmb = sex==="M" ? (10*weight + 6.25*height - 5*age + 5) : (10*weight + 6.25*height - 5*age - 161);
 const lvl = ACTIVITY_LEVELS.find(l=>l.k===activity) || ACTIVITY_LEVELS[1];
 return tmb * lvl.m;
}
function calcCalorieTarget(profile){
 const tdee = calcTDEE(profile);
 const obj = GOALS_OBJ.find(o=>o.k===profile.objective) || GOALS_OBJ[1];
 return Math.round(tdee + obj.adj);
}
function calcMacroTargets(profile){
 const kcal = calcCalorieTarget(profile);
 const protein = Math.round(profile.currentWeight * 1.8);
 const fatKcal = kcal*0.25; const fat = Math.round(fatKcal/9);
 const carbKcal = kcal - protein*4 - fatKcal; const carbs = Math.round(Math.max(carbKcal,0)/4);
 return {kcal, protein, carbs, fat};
}
function nutritionToday(profileId, date){
 date = date || todayStr();
 const entries = state.foodLog.filter(e=>e.profileId===profileId && e.date===date);
 const sum = entries.reduce((a,e)=>({kcal:a.kcal+e.kcal, protein:a.protein+e.protein, carbs:a.carbs+e.carbs, fat:a.fat+e.fat}),{kcal:0,protein:0,carbs:0,fat:0});
 return {entries, sum};
}
function weightStats(profileId){
 const list = state.weights.filter(w=>w.profileId===profileId).sort((a,b)=>a.date.localeCompare(b.date));
 const profile = getProfile(profileId);
 const current = list.length ? list[list.length-1].weight : profile.currentWeight;
 const initial = profile.initialWeight;
 const prev = list.length>1 ? list[list.length-2].weight : initial;
 return {list, current, initial, deltaStart: round1(current-initial), deltaLast: round1(current-prev)};
}
function attendanceStats(profileId){
 const dates = state.attendance.filter(a=>a.profileId===profileId).map(a=>a.date).sort();
 const set = new Set(dates);
 let streak=0; let cursor=new Date();
 for(;;){ const ds=cursor.toISOString().slice(0,10); if(set.has(ds)){streak++; cursor.setDate(cursor.getDate()-1);} else if(ds===todayStr()){cursor.setDate(cursor.getDate()-1); continue;} else break; }
 let best=0, run=0, prevD=null;
 dates.forEach(d=>{ if(prevD && daysBetween(prevD,d)===1) run++; else run=1; if(run>best) best=run; prevD=d; });
 const now = new Date(); const thisMonth = dates.filter(d=>{ const dd=new Date(d+"T00:00:00"); return dd.getFullYear()===now.getFullYear() && dd.getMonth()===now.getMonth(); }).length;
 const start = getProfile(profileId).startDate || dates[0] || todayStr();
 const totalDaysSince = Math.max(1, daysBetween(start, todayStr())+1);
 const pct = Math.round((dates.length/totalDaysSince)*100);
 const last24start = new Date(); last24start.setDate(last24start.getDate()-23);
 const last24count = dates.filter(d=> new Date(d+"T00:00:00") >= last24start).length;
 return {dates, total:dates.length, streak, best, thisMonth, pct:clamp(pct,0,100), last24count};
}
function exerciseHistory(profileId, exercise){
 return state.workouts.filter(w=>w.profileId===profileId && w.exercise===exercise).sort((a,b)=>a.date.localeCompare(b.date));
}
function coupleStats(){
 const ids = profileIds(); if(ids.length<2) return null;
 const [a,b] = ids;
 const attA = new Set(state.attendance.filter(x=>x.profileId===a).map(x=>x.date));
 const attB = new Set(state.attendance.filter(x=>x.profileId===b).map(x=>x.date));
 const together = [...attA].filter(d=>attB.has(d)).sort();
 let streak=0; let cursor=new Date();
 for(;;){ const ds=cursor.toISOString().slice(0,10); if(together.includes(ds)){streak++; cursor.setDate(cursor.getDate()-1);} else if(ds===todayStr()){cursor.setDate(cursor.getDate()-1); continue;} else break; }
 const daysSince = Math.max(0, daysBetween(coupleStartDateStr(), todayStr()));
 return {jointDays:together.length, streak, daysSince, totalA:attA.size, totalB:attB.size};
}

function goalTitle(g){
 const t = GOAL_TYPES.find(x=>x.k===g.type);

 if(g.type==="pesoobjetivo") return `Llegar a ${g.target} kg`;

 if(g.type==="racha") return `Mantener una racha de ${g.target} dias`;
 if(g.type==="proteina") return `Consumir ${g.target} g de proteina/dia`;
 if(g.type==="ejercicio") return `Mejorar ${g.exercise} a ${g.target} kg`;
 return t?.l||"Meta";

function goalCurrentValue(g){
 if(g.type==="peso"||g.type==="pesoobjetivo"){ return weightStats(g.profileId).current; }
 if(g.type==="asistencia"){ return state.attendance.filter(a=>a.profileId===g.profileId && a.date>=g.createdDate).length; }
 if(g.type==="racha"){ return attendanceStats(g.profileId).streak; }
 if(g.type==="proteina"){ return Math.round(nutritionToday(g.profileId).sum.protein); }
 if(g.type==="ejercicio"){ const h=exerciseHistory(g.profileId, g.exercise); return h.length? h[h.length-1].weight : g.startValue; }
 return 0;
}
function goalPct(g){
 const cur = goalCurrentValue(g);
 if(g.type==="peso"||g.type==="pesoobjetivo"||g.type==="ejercicio"){
  const span = Math.abs(g.target-g.startValue)||1; const done = g.target>=g.startValue? (cur-g.startValue) : (g.startValue-cur);
  return clamp(Math.round(done/span*100),0,100);
 }
 return clamp(Math.round(cur/g.target*100),0,100);
}

function renderCalendarGrid(pid,y,m,editable){
 const first = new Date(y,m,1); const startDow = first.getDay();

 let cells = dow.map(d=>`<div class="cal-dow">${d}</div>`).join('');
 for(let i=0;i<startDow;i++) cells += `<div class="cal-day empty"></div>`;
 for(let d=1; d<=daysInMonth; d++){
  const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const isFuture = ds > todayStr();
  const went = set.has(ds);
  const canToggle = editable && !isFuture;
  cells += `<div class="cal-day ${went?'went':''} ${ds===todayStr()?'today':''} ${isFuture?'future':''}" ${canToggle?`data-toggleday="${ds}" data-pid="${pid}"`:''}>${d}</div>`;
 }
 return `<div class="cal-grid">${cells}</div>`;
}

 </div>`;

function lineChartSvg(values, color){
 if(values.length<2) return '';
 const w=280,h=64,pad=6; const min=Math.min(...values),max=Math.max(...values);
 const range = (max-min)||1;
 const pts = values.map((v,i)=>{ const x=pad+(i/(values.length-1))*(w-pad*2); const y=h-pad-((v-min)/range)*(h-pad*2); return `${x},${y}`; }).join(' ');
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:64px" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

async function toggleAttendance(pid, date){
 if(!isMine(pid)) return;
 const exists = state.attendance.find(a=>a.profileId===pid && a.date===date);
 if(exists){
  const { error } = await sb.from('attendance').delete().eq('id', exists.id);
  if(error){ toast("Error al eliminar"); return; }
  state.attendance = state.attendance.filter(a=>a!==exists);
  toast("Asistencia eliminada");
 } else {
  const { data, error } = await sb.from('attendance').insert({user_id:pid, date}).select().single();
  if(error){ toast("Error al registrar"); return; }
  state.attendance.push(mapAttendance(data));
  toast(date===todayStr()? "¡Asistencia registrada! 💪" : "Asistencia agregada");
 }
 render();
}

let zxingReader = null;
function openBarcodeScanner(pid, meal){
 openModal(`
  <div class="modal-head"><h3>Escanear codigo</h3><button class="modal-close" data-close-modal>✕</button></div>
  <div style="position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4">
   <video id="mScanVideo" style="width:100%;height:100%;object-fit:cover;display:block" playsinline muted></video>
   <div style="position:absolute;inset:16px;border:3px solid var(--a);border-radius:14px;pointer-events:none;opacity:.7"></div>
  </div>
  <p class="faint" style="text-align:center;margin-top:10px">Apunta la camara al codigo de barras del producto</p>
  <div id="mScanStatus" class="faint" style="text-align:center;margin-top:4px"></div>
  <button class="btn secondary" id="mScanManual" style="margin-top:10px">Buscar manualmente en su lugar</button>
 `);
 document.getElementById("mScanManual").addEventListener("click", ()=>openAddFoodModal(pid, meal));
 startScanner(pid, meal);
}
function startScanner(pid, meal){
 try{
  zxingReader = new ZXing.BrowserMultiFormatReader();
  zxingReader.decodeFromVideoDevice(undefined, "mScanVideo", (result, err)=>{
   if(result){
    const code = result.getText();
    stopScanner();
    lookupBarcode(code, pid, meal);
   }
  });
 }catch(err){
  const st = document.getElementById("mScanStatus");
  if(st) st.textContent = "No se pudo acceder a la camara. Revisa los permisos de Safari.";
 }
}
function stopScanner(){
 if(zxingReader){ try{ zxingReader.reset(); }catch(e){} zxingReader = null; }
}
async function lookupBarcode(code, pid, meal){
 openModal(`<div class="modal-head"><h3>Buscando...</h3></div><div class="empty"><div class="ic">🔍</div><p>Consultando Open Food Facts...</p></div>`);
 try{
  const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json`);
  const data = await res.json();
  if(data.status !== 1 || !data.product){
   toast("Producto no encontrado en Open Food Facts");
   openAddFoodModal(pid, meal);
   return;
  }
  const p = data.product;
  const n = p.nutriments || {};
  const kcal = n["energy-kcal_100g"] ?? (n["energy_100g"] ? n["energy_100g"]/4.184 : 0);
  showScannedProduct({
   name: p.product_name || p.generic_name || "Producto sin nombre",
   brand: p.brands || "",
   kcal: Math.round(kcal||0), protein: n["proteins_100g"]||0, carbs: n["carbohydrates_100g"]||0, fat: n["fat_100g"]||0,
   code
  }, pid, meal);
 }catch(err){
  toast("Error consultando Open Food Facts");
  openAddFoodModal(pid, meal);
 }
}

 openModal(`
  <div class="modal-head"><h3>Producto encontrado</h3><button class="modal-close" data-close-modal>✕</button></div>
  <div class="card">
   <b>${prod.name}</b>
   ${prod.brand? `<div class="faint">${prod.brand}</div>` : ''}
   <div class="faint" style="margin-top:4px">Codigo: ${prod.code}</div>

function resizeImageToCanvas(file, cb, maxW){
 maxW = maxW || 900;
 const reader = new FileReader();
 reader.onload = (ev)=>{
  const img = new Image();
  img.onload = ()=>{
   const scale=Math.min(1,maxW/img.width);
   const canvas=document.createElement("canvas"); canvas.width=img.width*scale; canvas.height=img.height*scale;
   canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
   cb(canvas);
  };
  img.src = ev.target.result;
 };
 reader.readAsDataURL(file);
}

 document.getElementById("adminExportFoods").addEventListener("click", exportFoodsDatabase);
 document.getElementById("adminBulkUploadBtn").addEventListener("click", ()=>document.getElementById("adminBulkFile").click());
 document.getElementById("adminBulkFile").addEventListener("change", (e)=>{ const f=e.target.files[0]; if(f) handleBulkFoodFile(f); e.target.value=''; });
 document.getElementById("adminFoodSearch").addEventListener("input", (e)=>renderAdminFoodsList(e.target.value));
 document.querySelectorAll("[data-editfood]").forEach(b=>b.addEventListener("click",()=>openFoodEditModal(state.foods.find(f=>f.id===b.dataset.editfood))));
 document.querySelectorAll("[data-delfoodadmin]").forEach(b=>b.addEventListener("click", async ()=>{
  const id=b.dataset.delfoodadmin;
  const { error } = await sb.from('foods').delete().eq('id', id);
  if(error){ toast("Error eliminando"); return; }

const FOOD_TEMPLATE_HEADERS = ["nombre","categoria","kcal","proteina","carbohidratos","grasa","unidad","gramos_por_unidad"];
function downloadFoodTemplate(){
 const example = [
  ["Pechuga de pollo","Proteina",165,31,0,3.6,"",""],
  ["Manzana","Fruta",52,0.3,14,0.2,"unidad",180],
  ["Categorias validas: Proteina, Carbohidrato, Fruta, Verdura, Lacteo, Grasa, Snack, Bebida","","","","","","",""],
 ];
 const ws = XLSX.utils.aoa_to_sheet([FOOD_TEMPLATE_HEADERS, ...example]);
 ws['!cols'] = FOOD_TEMPLATE_HEADERS.map(()=>({wch:18}));
 const wb = XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb, ws, "Alimentos");
 XLSX.writeFile(wb, "plantilla_alimentos.xlsx");
}
function exportFoodsDatabase(){
 const rows = state.foods.slice().sort((a,b)=>a.c.localeCompare(b.c)||a.n.localeCompare(b.n))
  .map(f=>[f.n, f.c, f.k, f.p, f.cb, f.f, f.unit||"", f.g||""]);
 const ws = XLSX.utils.aoa_to_sheet([FOOD_TEMPLATE_HEADERS, ...rows]);
 ws['!cols'] = FOOD_TEMPLATE_HEADERS.map(()=>({wch:18}));
 const wb = XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb, ws, "Alimentos");
 XLSX.writeFile(wb, `base_alimentos_${todayStr()}.xlsx`);
 toast(`${rows.length} alimentos exportados`);
}
function normKey(k){ return String(k).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,""); }
function handleBulkFoodFile(file){
 toast("Leyendo archivo...");
 const reader = new FileReader();
 reader.onload = async (e)=>{
  try{
   const data = new Uint8Array(e.target.result);
   const wb = XLSX.read(data, {type:"array"});
   const sheet = wb.Sheets[wb.SheetNames[0]];
   const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
   await bulkImportFoods(rows);
  }catch(err){ toast("No se pudo leer el archivo"); }
 };
 reader.readAsArrayBuffer(file);
}
async function bulkImportFoods(rows){
 const catByNorm = {}; FOOD_CATS.forEach(c=> catByNorm[normKey(c)]=c);
 const toInsert = []; let skipped = 0;
 rows.forEach(r=>{
  const norm = {}; Object.keys(r).forEach(k=> norm[normKey(k)] = r[k]);
  const name = String(norm["nombre"]||"").trim();
  const cat = catByNorm[normKey(norm["categoria"]||"")];
  const kcal = parseFloat(norm["kcal"]);
  const protein = parseFloat(norm["proteina"]);
  const carbs = parseFloat(norm["carbohidratos"]);
  const fat = parseFloat(norm["grasa"]);
  if(!name || !cat || isNaN(kcal) || isNaN(protein) || isNaN(carbs) || isNaN(fat)){ skipped++; return; }
  const unit = String(norm["unidad"]||"").trim() || null;
  const gramsRaw = norm["gramosporunidad"];
  const grams = unit && gramsRaw!==undefined && gramsRaw!=="" && !isNaN(parseFloat(gramsRaw)) ? parseFloat(gramsRaw) : null;
  toInsert.push({name, category:cat, kcal, protein, carbs, fat, unit_label:unit, grams_per_unit:grams});
 });
 if(!toInsert.length){ toast("No se encontraron filas validas en el archivo"); return; }
 const { data, error } = await sb.from('foods').insert(toInsert).select();
 if(error){ toast("Error al subir alimentos"); return; }
 state.foods.push(...data.map(mapFood));
 toast(`${data.length} alimentos agregados${skipped?` · ${skipped} filas omitidas`:''}`);
 renderAdminFoodsList("");
}
function openFoodEditModal(food){
 const isNew = !food;
 openModal(`
  <div class="modal-head"><h3>${isNew?'Nuevo alimento':'Editar alimento'}</h3><button class="modal-close" data-close-modal>✕</button></div>
  <div class="field"><label>Nombre</label><input id="fName" value="${food?food.n:''}"></div>
  <div class="field"><label>Categoria</label><select id="fCat">${FOOD_CATS.map(c=>`<option value="${c}" ${food&&food.c===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="field-row">
   <div class="field"><label>Kcal /100g</label><input id="fKcal" type="number" step="any" value="${food?food.k:''}"></div>
   <div class="field"><label>Proteina /100g</label><input id="fProt" type="number" step="any" value="${food?food.p:''}"></div>
  </div>
  <div class="field-row">
   <div class="field"><label>Carbos /100g</label><input id="fCarb" type="number" step="any" value="${food?food.cb:''}"></div>
   <div class="field"><label>Grasa /100g</label><input id="fFat" type="number" step="any" value="${food?food.f:''}"></div>
  </div>
  <div class="field-row">
   <div class="field"><label>Unidad (opcional, ej. "unidad")</label><input id="fUnit" value="${food&&food.unit?food.unit:''}"></div>
   <div class="field"><label>Gramos por unidad</label><input id="fGrams" type="number" value="${food&&food.g?food.g:''}"></div>
  </div>
  <button class="btn" id="fSave">${isNew?'Crear':'Guardar cambios'}</button>`);
 document.getElementById("fSave").addEventListener("click", async ()=>{
  const name=document.getElementById("fName").value.trim();
  if(!name){ toast("Escribe un nombre"); return; }
  const btn = document.getElementById("fSave"); btn.disabled=true;
  const row = { name, category:document.getElementById("fCat").value,
   kcal:+document.getElementById("fKcal").value||0, protein:+document.getElementById("fProt").value||0,
   carbs:+document.getElementById("fCarb").value||0, fat:+document.getElementById("fFat").value||0,
   unit_label: document.getElementById("fUnit").value.trim()||null,
   grams_per_unit: document.getElementById("fGrams").value? +document.getElementById("fGrams").value : null };
  if(isNew){
   const { data, error } = await sb.from('foods').insert(row).select().single();
   if(error){ toast("Error guardando"); btn.disabled=false; return; }
   state.foods.push(mapFood(data));
  } else {
   const { error } = await sb.from('foods').update(row).eq('id', food.id);
   if(error){ toast("Error guardando"); btn.disabled=false; return; }
   Object.assign(food, mapFood({...row, id:food.id}));
  }
  closeModal(); toast("Alimento guardado"); renderAdminFoodsList("");
 });
}

/* ============================= BIND: modal + tab-specific ============================= */
function bindModalActions(){
 document.querySelectorAll("[data-close-modal]").forEach(b=>b.addEventListener("click", closeModal));
}
function bindCompareSlider(){
 const cmpSlider = document.getElementById("cmpSlider");
 if(!cmpSlider) return;
 const before=document.getElementById("cmpImgBefore"), after=document.getElementById("cmpImgAfter"), line=document.getElementById("cmpLine");
 cmpSlider.addEventListener("input", ()=>{ const v=cmpSlider.value; after.style.clipPath=`inset(0 0 0 ${v}%)`; line.style.left=v+"%"; });
 const beforeSel=document.getElementById("cmpBefore"), afterSel=document.getElementById("cmpAfter");
 const pid = scopedProfileId(); const photos = state.photos.filter(p=>p.profileId===pid).sort((a,b)=>a.date.localeCompare(b.date));
 if(beforeSel) beforeSel.addEventListener("change", ()=>{ before.src = photos[+beforeSel.value].img; });
 if(afterSel) afterSel.addEventListener("change", ()=>{ after.src = photos[+afterSel.value].img; });
}
function bindTabSpecific(){
 const tab = state.ui.tab;
 if(tab==="nutricion"){
  app.querySelectorAll("[data-addfood]").forEach(b=>b.addEventListener("click",()=>openAddFoodModal(scopedProfileId(), b.dataset.addfood)));
  app.querySelectorAll("[data-delfood]").forEach(b=>b.addEventListener("click", async ()=>{
   const id=b.dataset.delfood;
   const { error } = await sb.from('food_log').delete().eq('id', id);
   if(error){ toast("Error eliminando"); return; }
   state.foodLog=state.foodLog.filter(f=>f.id!==id); render();
  }));
  const histbtn = app.querySelector("[data-histbtn]"); if(histbtn) histbtn.addEventListener("click",()=>openHistoryModal("comida", scopedProfileId()));
  app.querySelectorAll("[data-daynav]").forEach(b=>b.addEventListener("click",()=>{
   const d=new Date((nutHistoryDate||todayStr())+"T00:00:00"); d.setDate(d.getDate()+ (+b.dataset.daynav));
   const ds=d.toISOString().slice(0,10); nutHistoryDate = ds>todayStr()? todayStr() : ds; render();
  }));
 }
 if(tab==="entreno"){
  app.querySelectorAll("[data-sub]").forEach(b=>b.addEventListener("click",()=>{ state.ui.trainSub=b.dataset.sub; render(); }));
  app.querySelectorAll("[data-calnav]").forEach(b=>b.addEventListener("click",()=>{
   let m=state.ui.calMonth+(+b.dataset.calnav), y=state.ui.calYear; if(m<0){m=11;y--;} if(m>11){m=0;y++;} state.ui.calMonth=m; state.ui.calYear=y; render();
  }));
  app.querySelectorAll("[data-toggleday]").forEach(b=>b.addEventListener("click",()=>toggleAttendance(b.dataset.pid, b.dataset.toggleday)));
  app.querySelectorAll("[data-delworkout]").forEach(b=>b.addEventListener("click", async ()=>{
   const id=b.dataset.delworkout;
   const { error } = await sb.from('workouts').delete().eq('id', id);
   if(error){ toast("Error eliminando"); return; }
   state.workouts=state.workouts.filter(w=>w.id!==id); render();
  }));
 }
 if(tab==="progreso"){
  app.querySelectorAll("[data-sub2]").forEach(b=>b.addEventListener("click",()=>{ state.ui.progSub=b.dataset.sub2; render(); }));
  app.querySelectorAll("[data-delweight]").forEach(b=>b.addEventListener("click", async ()=>{
   const id=b.dataset.delweight;
   const { error } = await sb.from('weights').delete().eq('id', id);
   if(error){ toast("Error eliminando"); return; }
   state.weights=state.weights.filter(w=>w.id!==id); render();
  }));
  app.querySelectorAll("[data-delgoal]").forEach(b=>b.addEventListener("click", async ()=>{
   const id=b.dataset.delgoal;
   const { error } = await sb.from('goals').delete().eq('id', id);
   if(error){ toast("Error eliminando"); return; }
   state.goals=state.goals.filter(g=>g.id!==id); render();
  }));
  app.querySelectorAll("[data-photoview]").forEach(b=>b.addEventListener("click",()=>openPhotoDetail(b.dataset.photoview)));
  bindCompareSlider();
 }
 if(tab==="perfil"){
  const av = app.querySelector("[data-avatarupload]"); if(av) av.addEventListener("click", openAvatarUpload);
  app.querySelectorAll("[data-editprofile]").forEach(b=>b.addEventListener("click",()=>openEditProfileModal(b.dataset.editprofile)));
  app.querySelectorAll("[data-openhist]").forEach(b=>b.addEventListener("click",()=>openHistoryModal(b.dataset.openhist, state.myId)));
  const admin = app.querySelector("[data-openadminfoods]"); if(admin) admin.addEventListener("click", openAdminFoodsModal);
  const exp = app.querySelector("[data-exportdata]"); if(exp) exp.addEventListener("click", exportData);
  const lo = app.querySelector("[data-logout]"); if(lo) lo.addEventListener("click", doLogout);
 }
}
function exportData(){
 const payload = { profile:getProfile(state.myId), weights:state.weights.filter(w=>w.profileId===state.myId),
  foodLog:state.foodLog.filter(f=>f.profileId===state.myId), attendance:state.attendance.filter(a=>a.profileId===state.myId),
  workouts:state.workouts.filter(w=>w.profileId===state.myId), goals:state.goals.filter(g=>g.profileId===state.myId) };
 const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
 const url = URL.createObjectURL(blob);
 const a = document.createElement("a"); a.href=url; a.download=`nosotrosfit_backup_${todayStr()}.json`; a.click();
 URL.revokeObjectURL(url);
}

boot();
})();
